# Manual load test against a deployed environment. Prod runs read-only scenarios; the orders
# scenario creates real orders, so it is refused on prod at job level, before any approval is requested.
# Prod runs only from main. No Azure identity: it only calls the public site URL.
name: load

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        required: true
        type: choice
        options:
          - dev
          - prod
      scenario:
        description: realistic (Saturday peak), peak3x, stress (ramp up) or orders (dev only, creates orders)
        required: true
        type: choice
        options:
          - realistic
          - peak3x
          - stress
          - orders

permissions:
  contents: read

jobs:
  load:
    name: load
    if: "!(inputs.environment == 'prod' && inputs.scenario == 'orders') && (inputs.environment != 'prod' || github.ref == 'refs/heads/main')"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # Own group: sharing the deploy group could cancel a deploy that is pending behind this run.
    concurrency:
      group: load-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SCENARIO: ${{ inputs.scenario }}
      RESULTS_DIR: load-results
      # Update both URLs if a Static Web App is recreated: the default hostname changes.
      BASE_URL: ${{ inputs.environment == 'prod' && 'https://salmon-stone-0be061010.6.azurestaticapps.net' || 'https://wonderful-field-023b47e10.4.azurestaticapps.net' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.8.3"
      - name: Run k6
        run: |
          mkdir -p "$RESULTS_DIR"
          k6 run load/load.js
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$RESULTS_DIR/summary.txt" ]; then
            {
              echo '### Load test: '"$SCENARIO"' on '"$ENVIRONMENT"
              echo '```'
              cat "$RESULTS_DIR/summary.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-results-${{ inputs.environment }}-${{ inputs.scenario }}
          path: load-results/
          if-no-files-found: warn

  guard:
    name: guard
    if: inputs.environment == 'prod' && (inputs.scenario == 'orders' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Refuse unsafe run on prod
        run: |
          echo "::error::On prod the orders scenario is refused (it creates real orders) and the workflow runs only from main"
          exit 1
