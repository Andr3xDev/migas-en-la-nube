<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Productos - Administración - Migas en la Nube</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand"><img src="/img/logo.svg" alt="Migas en la Nube" /><small>Administración</small></a>
      <nav>
        <a href="/admin/" data-icon="utensils">Productos</a>
        <a href="/admin/orders.html" data-icon="receipt">Pedidos</a>
        <a href="/" id="logout" data-icon="log-out" data-user>Salir</a>
      </nav>
    </header>
    <main>
      <h1>Administrar productos</h1>
      <div id="guard-message" aria-live="polite"></div>
      <div id="panel" hidden>
        <div id="summary"></div>
        <div class="list-heading">
          <h2>Productos</h2>
          <button type="button" class="button" id="create-product">Crear producto</button>
        </div>
        <div id="list-feedback" aria-live="polite"></div>
        <div id="product-list"></div>
      </div>
      <dialog id="product-dialog" aria-labelledby="form-title">
        <h2 id="form-title">Nuevo producto</h2>
        <form id="product-form">
          <p>
            <label for="name">Nombre</label>
            <input id="name" name="name" required maxlength="120" />
          </p>
          <p>
            <label for="category">Categoría</label>
            <input id="category" name="category" required maxlength="60" />
          </p>
          <p>
            <label for="description">Descripción</label>
            <textarea id="description" name="description" maxlength="1000"></textarea>
          </p>
          <p>
            <label for="prep-minutes">Minutos de preparación</label>
            <input id="prep-minutes" name="prepMinutes" type="number" min="0" step="1" required />
          </p>
          <fieldset>
            <legend>Variantes (precio final en pesos, IVA incluido)</legend>
            <div id="variants"></div>
            <button type="button" class="button button-secondary" id="add-variant">Agregar variante</button>
          </fieldset>
          <p>
            <label for="image">Imagen (JPEG, PNG o WebP, máximo 2 MB)</label>
            <input id="image" name="image" type="file" accept="image/jpeg,image/png,image/webp" />
          </p>
          <div id="current-image"></div>
          <div class="form-actions">
            <button type="submit" class="button" id="submit">Guardar</button>
            <button type="button" class="button button-secondary" id="reset">Cancelar</button>
          </div>
        </form>
        <div id="feedback" aria-live="polite"></div>
      </dialog>
      <dialog id="restock-dialog" aria-labelledby="restock-title">
        <h2 id="restock-title">Hornear</h2>
        <form id="restock-form">
          <p>
            <label for="restock-variant">Variante</label>
            <select id="restock-variant" required></select>
          </p>
          <p id="restock-current"></p>
          <p>
            <label for="restock-units">Unidades a agregar</label>
            <input id="restock-units" type="number" min="1" step="1" required />
          </p>
          <div class="form-actions">
            <button type="submit" class="button" id="restock-submit">Agregar al stock</button>
            <button type="button" class="button button-secondary" id="restock-cancel">Cancelar</button>
          </div>
        </form>
        <div id="restock-feedback" aria-live="polite"></div>
      </dialog>
    </main>
    <footer><p>Migas en la Nube · Panel de administración</p></footer>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/admin/products.js"></script>
  </body>
</html>
