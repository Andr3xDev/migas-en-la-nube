<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedido - Pan de la Casa</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <a href="/">Pan de la Casa</a>
      <a href="/cart.html">Carrito</a>
    </header>
    <main>
      <h1>Hacer pedido</h1>
      <div id="summary"></div>
      <form id="checkout-form">
        <p>
          <label for="customer-name">Nombre</label>
          <input id="customer-name" name="customerName" type="text" required maxlength="100" />
        </p>
        <p>
          <label for="phone">Teléfono</label>
          <input id="phone" name="phone" type="tel" required maxlength="20" />
        </p>
        <p>
          <label for="pickup-time">Hora de recogida</label>
          <input id="pickup-time" name="pickupTime" type="datetime-local" required />
        </p>
        <button type="submit" class="button" id="submit">Enviar pedido</button>
      </form>
      <div id="feedback" aria-live="polite"></div>
    </main>
    <script type="module" src="/js/checkout.js"></script>
  </body>
</html>
