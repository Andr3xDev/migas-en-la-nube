<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar - Pan de la Casa</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header>
      <a href="/">Pan de la Casa</a>
      <nav>
        <a href="/cart.html">Carrito</a>
        <a href="/login.html" data-guest>Ingresar</a>
        <a href="/register.html" data-guest>Crear cuenta</a>
        <a href="/" id="logout" data-user hidden>Salir</a>
      </nav>
    </header>
    <main>
      <h1>Ingresar</h1>
      <form id="login-form">
        <p>
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" required maxlength="254" />
        </p>
        <p>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required maxlength="1024" />
        </p>
        <button type="submit" class="button" id="submit">Ingresar</button>
      </form>
      <div id="feedback" aria-live="polite"></div>
    </main>
    <script type="module" src="/js/nav.js"></script>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
